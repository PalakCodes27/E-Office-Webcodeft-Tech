{% load static %}

<!-- =========================================================
     WEBCODEFT CHAT WIDGET
     PROFESSIONAL TEAL + WHITE
     
     DJANGO CONNECTED VERSION

     FEATURES:
     - Admin -> Employees
     - Employee -> Admin
     - Search users
     - Online / Offline
     - Unread messages
     - Real database messages
     - Send messages
     - Auto refresh
     - Responsive
     - Dashboard logo untouched
========================================================= -->


<style>

/* =========================================================
   CHAT VARIABLES
========================================================= */

:root {

    --cw-teal: #0f766e;
    --cw-teal-dark: #0b5f59;
    --cw-teal-deep: #064e4b;

    --cw-teal-soft: #ccfbf1;
    --cw-teal-light: #f0fdfa;

    --cw-white: #ffffff;
    --cw-bg: #f8fafc;

    --cw-border: #e2e8f0;

    --cw-text: #0f172a;
    --cw-muted: #64748b;
    --cw-light-text: #94a3b8;

    --cw-success: #22c55e;
    --cw-danger: #ef4444;

    --cw-shadow:
        0 25px 60px rgba(15, 23, 42, 0.18),
        0 8px 20px rgba(15, 23, 42, 0.08);
}


/* =========================================================
   LAUNCHER
========================================================= */

.cw-launcher {

    position: fixed;

    right: 24px;
    bottom: 24px;

    width: 60px;
    height: 60px;

    padding: 0;
    margin: 0;

    border: none;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            var(--cw-teal),
            var(--cw-teal-dark)
        );

    color: var(--cw-white);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 2147483000;

    box-shadow:
        0 14px 35px rgba(15, 118, 110, 0.28);

    transition:
        transform .22s ease,
        box-shadow .22s ease;
}


.cw-launcher:hover {

    transform: translateY(-4px);

    box-shadow:
        0 18px 42px rgba(15, 118, 110, 0.35);
}


.cw-launcher:active {

    transform: scale(.94);
}


.cw-launcher.cw-is-hidden {

    display: none;
}


.cw-launcher-icon {

    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;

    line-height: 1;
}


/* =========================================================
   UNREAD BADGE
========================================================= */

.cw-unread {

    position: absolute;

    top: -5px;
    right: -5px;

    min-width: 21px;
    height: 21px;

    padding: 0 5px;

    border-radius: 20px;

    background: var(--cw-danger);

    color: white;

    border: 2px solid white;

    font-size: 9px;

    font-weight: 800;

    display: none;

    align-items: center;
    justify-content: center;
}


/* =========================================================
   MAIN WIDGET
========================================================= */

.cw-widget {

    position: fixed;

    right: 24px;
    bottom: 24px;

    width: 420px;

    height: min(650px, calc(100vh - 48px));

    min-height: 480px;

    max-width: calc(100vw - 32px);

    max-height: calc(100vh - 32px);

    margin: 0;
    padding: 0;

    background: white;

    border: 1px solid var(--cw-border);

    border-radius: 22px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    box-sizing: border-box;

    z-index: 2147483001;

    box-shadow: var(--cw-shadow);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    animation:
        cwOpen .24s ease;
}


.cw-widget *,
.cw-widget *::before,
.cw-widget *::after {

    box-sizing: border-box;
}


.cw-widget.cw-hidden {

    display: none;
}


.cw-widget.cw-minimized {

    height: 76px;
    min-height: 76px;
}


@keyframes cwOpen {

    from {

        opacity: 0;

        transform:
            translateY(14px)
            scale(.97);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   HEADER
========================================================= */

.cw-header {

    width: 100%;

    min-height: 76px;

    flex: 0 0 76px;

    padding:
        11px 12px 11px 14px;

    background:
        linear-gradient(
            135deg,
            var(--cw-teal),
            var(--cw-teal-dark)
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}


.cw-header-left {

    display: flex;

    align-items: center;

    gap: 11px;

    min-width: 0;

    flex: 1;
}


.cw-brand {

    width: 44px;
    height: 44px;

    flex: 0 0 44px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.15);

    border:
        1px solid
        rgba(255,255,255,.28);

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 21px;
}


.cw-header-info {

    min-width: 0;

    overflow: hidden;
}


.cw-title {

    margin: 0;

    padding: 0;

    font-size: 15px;

    font-weight: 750;

    line-height: 20px;

    color: white;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.cw-subtitle {

    margin: 3px 0 0;

    padding: 0;

    font-size: 10px;

    line-height: 15px;

    color:
        rgba(255,255,255,.78);

    display: flex;

    align-items: center;

    gap: 6px;
}


.cw-online {

    width: 7px;
    height: 7px;

    flex: 0 0 7px;

    border-radius: 50%;

    background: #34d399;

    box-shadow:
        0 0 0 3px
        rgba(52,211,153,.16);
}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.cw-actions {

    display: flex;

    align-items: center;

    gap: 4px;

    flex: 0 0 auto;
}


.cw-action {

    width: 34px;
    height: 34px;

    padding: 0;
    margin: 0;

    border: none;

    border-radius: 9px;

    background: transparent;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 19px;

    transition:
        background .18s ease,
        transform .18s ease;
}


.cw-action:hover {

    background:
        rgba(255,255,255,.15);

    transform:
        translateY(-1px);
}


.cw-action:active {

    transform: scale(.92);
}


/* =========================================================
   USER SEARCH / CONTACT AREA
========================================================= */

.cw-users-area {

    flex: 0 0 auto;

    width: 100%;

    background: white;

    border-bottom:
        1px solid
        var(--cw-border);

    padding: 10px;
}


/* Search */

.cw-search-wrap {

    position: relative;

    width: 100%;

    margin-bottom: 9px;
}


.cw-search-icon {

    position: absolute;

    left: 11px;
    top: 50%;

    transform:
        translateY(-50%);

    color:
        var(--cw-muted);

    font-size: 13px;

    pointer-events: none;
}


.cw-search {

    width: 100%;

    height: 36px;

    padding:
        0 12px 0 32px;

    border:
        1px solid
        var(--cw-border);

    border-radius: 10px;

    outline: none;

    background:
        #f8fafc;

    color:
        var(--cw-text);

    font-size: 11px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.cw-search:focus {

    border-color:
        var(--cw-teal);

    box-shadow:
        0 0 0 3px
        rgba(15,118,110,.08);

    background: white;
}


.cw-search::placeholder {

    color:
        var(--cw-light-text);
}


/* Users list */

.cw-users {

    width: 100%;

    display: flex;

    gap: 8px;

    overflow-x: auto;

    overflow-y: hidden;

    padding-bottom: 2px;

    scrollbar-width: thin;
}


.cw-users::-webkit-scrollbar {

    height: 4px;
}


.cw-users::-webkit-scrollbar-thumb {

    background: #cbd5e1;

    border-radius: 10px;
}


/* User item */

.cw-user {

    position: relative;

    flex: 0 0 auto;

    width: 132px;

    min-height: 54px;

    padding: 7px 8px;

    border:
        1px solid
        var(--cw-border);

    border-radius: 12px;

    background: #fff;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 8px;

    transition:
        border-color .18s ease,
        background .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
}


.cw-user:hover {

    border-color:
        rgba(15,118,110,.35);

    background:
        var(--cw-teal-light);

    transform:
        translateY(-1px);

    box-shadow:
        0 5px 12px
        rgba(15,118,110,.07);
}


.cw-user.cw-selected {

    background:
        var(--cw-teal-light);

    border-color:
        var(--cw-teal);

    box-shadow:
        0 4px 12px
        rgba(15,118,110,.10);
}


/* Avatar */

.cw-user-avatar {

    position: relative;

    width: 34px;
    height: 34px;

    flex: 0 0 34px;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            var(--cw-teal),
            var(--cw-teal-dark)
        );

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 11px;

    font-weight: 800;
}


.cw-status-dot {

    position: absolute;

    right: -2px;
    bottom: -2px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        #94a3b8;

    border:
        2px solid white;
}


.cw-status-dot.cw-status-online {

    background:
        var(--cw-success);
}


/* User text */

.cw-user-info {

    min-width: 0;

    flex: 1;
}


.cw-user-name {

    display: block;

    margin: 0;

    font-size: 10px;

    font-weight: 750;

    color:
        var(--cw-text);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.cw-user-status {

    display: block;

    margin-top: 2px;

    font-size: 8px;

    color:
        var(--cw-muted);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* Unread per user */

.cw-user-unread {

    position: absolute;

    top: 4px;
    right: 4px;

    min-width: 16px;
    height: 16px;

    padding: 0 4px;

    border-radius: 20px;

    background:
        var(--cw-danger);

    color: white;

    font-size: 7px;

    font-weight: 800;

    display: none;

    align-items: center;

    justify-content: center;
}


/* No users */

.cw-no-users {

    width: 100%;

    padding:
        10px 5px;

    text-align: center;

    color:
        var(--cw-muted);

    font-size: 9px;
}


.cw-loading-users {

    width: 100%;

    padding:
        10px 5px;

    text-align: center;

    color:
        var(--cw-muted);

    font-size: 9px;
}


/* =========================================================
   SELECTED CHAT BAR
========================================================= */

.cw-selected-bar {

    width: 100%;

    flex: 0 0 auto;

    min-height: 46px;

    padding:
        7px 13px;

    background:
        #ffffff;

    border-bottom:
        1px solid
        var(--cw-border);

    display: flex;

    align-items: center;

    gap: 9px;
}


.cw-selected-avatar {

    width: 31px;
    height: 31px;

    flex: 0 0 31px;

    border-radius: 9px;

    background:
        var(--cw-teal-soft);

    color:
        var(--cw-teal-dark);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 10px;

    font-weight: 800;
}


.cw-selected-info {

    min-width: 0;

    flex: 1;
}


.cw-selected-name {

    margin: 0;

    color:
        var(--cw-text);

    font-size: 11px;

    font-weight: 750;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.cw-selected-status {

    margin: 2px 0 0;

    color:
        var(--cw-muted);

    font-size: 8px;
}


.cw-selected-status.cw-online-text {

    color:
        #16a34a;
}


/* =========================================================
   CONTENT
========================================================= */

.cw-content {

    flex: 1;

    min-height: 0;

    width: 100%;

    display: flex;

    flex-direction: column;

    background:
        var(--cw-bg);

    overflow: hidden;
}


/* =========================================================
   MESSAGES
========================================================= */

.cw-messages {

    flex: 1;

    min-height: 0;

    width: 100%;

    overflow-y: auto;

    overflow-x: hidden;

    padding:
        16px
        15px
        12px;

    scroll-behavior: smooth;

    overscroll-behavior: contain;
}


.cw-messages::-webkit-scrollbar {

    width: 5px;
}


.cw-messages::-webkit-scrollbar-track {

    background: transparent;
}


.cw-messages::-webkit-scrollbar-thumb {

    background:
        #cbd5e1;

    border-radius: 20px;
}


.cw-messages::-webkit-scrollbar-thumb:hover {

    background:
        #94a3b8;
}


.cw-messages {

    scrollbar-width: thin;

    scrollbar-color:
        #cbd5e1
        transparent;
}


/* =========================================================
   DATE
========================================================= */

.cw-date {

    display: flex;

    align-items: center;

    justify-content: center;

    margin:
        0 0 16px;
}


.cw-date span {

    padding:
        4px 10px;

    border-radius: 20px;

    background:
        var(--cw-teal-light);

    color:
        var(--cw-teal-dark);

    font-size: 8px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .5px;
}


/* =========================================================
   MESSAGE ROW
========================================================= */

.cw-message-row {

    width: 100%;

    display: flex;

    margin:
        0 0 10px;
}


.cw-message-row.cw-received {

    justify-content:
        flex-start;
}


.cw-message-row.cw-sent {

    justify-content:
        flex-end;
}


.cw-message {

    max-width: 78%;

    padding:
        8px 11px;

    border-radius: 15px;

    font-size: 11px;

    line-height: 1.5;

    word-break: break-word;

    overflow-wrap: anywhere;

    position: relative;
}


.cw-received-message {

    background: white;

    color:
        var(--cw-text);

    border:
        1px solid
        var(--cw-border);

    border-bottom-left-radius: 5px;

    box-shadow:
        0 2px 7px
        rgba(15,23,42,.04);
}


.cw-sent-message {

    background:
        linear-gradient(
            135deg,
            var(--cw-teal),
            var(--cw-teal-dark)
        );

    color: white;

    border-bottom-right-radius: 5px;

    box-shadow:
        0 4px 10px
        rgba(15,118,110,.16);
}


.cw-meta {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 4px;

    margin-top: 4px;

    font-size: 7px;

    line-height: 9px;

    opacity: .65;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.cw-empty {

    min-height: 100%;

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        25px 20px;
}


.cw-empty-inner {

    width: 100%;

    max-width: 250px;
}


.cw-empty-icon {

    width: 62px;
    height: 62px;

    margin:
        0 auto 13px;

    border-radius: 18px;

    background:
        var(--cw-teal-soft);

    color:
        var(--cw-teal);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 27px;

    box-shadow:
        0 8px 20px
        rgba(15,118,110,.08);
}


.cw-empty-title {

    margin:
        0 0 6px;

    font-size: 14px;

    font-weight: 750;

    color:
        var(--cw-text);
}


.cw-empty-text {

    margin: 0;

    font-size: 10px;

    line-height: 16px;

    color:
        var(--cw-muted);
}


/* =========================================================
   LOADING
========================================================= */

.cw-chat-loading {

    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 100%;

    color:
        var(--cw-muted);

    font-size: 10px;
}


.cw-loader {

    width: 18px;
    height: 18px;

    border:
        2px solid
        #dbeafe;

    border-top-color:
        var(--cw-teal);

    border-radius: 50%;

    animation:
        cwSpin .7s linear infinite;

    margin-right: 7px;
}


@keyframes cwSpin {

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   TYPING
========================================================= */

.cw-typing {

    display: none;

    flex: 0 0 auto;

    padding:
        0 15px 7px;

    font-size: 8px;

    color:
        var(--cw-muted);
}


.cw-typing.cw-show {

    display: block;
}


.cw-dots {

    display: inline-flex;

    align-items: center;

    gap: 3px;

    margin-left: 3px;
}


.cw-dots span {

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background:
        var(--cw-teal);

    animation:
        cwDot 1.2s
        infinite ease-in-out;
}


.cw-dots span:nth-child(2) {

    animation-delay:
        .15s;
}


.cw-dots span:nth-child(3) {

    animation-delay:
        .30s;
}


@keyframes cwDot {

    0%,
    60%,
    100% {

        transform:
            translateY(0);

        opacity: .35;
    }

    30% {

        transform:
            translateY(-3px);

        opacity: 1;
    }
}


/* =========================================================
   INPUT
========================================================= */

.cw-input-area {

    flex: 0 0 auto;

    width: 100%;

    padding:
        9px 11px 7px;

    background: white;

    border-top:
        1px solid
        var(--cw-border);

    display: flex;

    align-items: flex-end;

    gap: 8px;
}


.cw-input-wrap {

    flex: 1;

    min-width: 0;

    background:
        #f8fafc;

    border:
        1px solid
        var(--cw-border);

    border-radius: 13px;

    display: flex;

    align-items: flex-end;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.cw-input-wrap:focus-within {

    border-color:
        var(--cw-teal);

    box-shadow:
        0 0 0 3px
        rgba(15,118,110,.08);
}


.cw-input {

    width: 100%;

    min-height: 40px;

    max-height: 100px;

    resize: none;

    border: none;

    outline: none;

    background: transparent;

    color:
        var(--cw-text);

    padding:
        10px 11px;

    margin: 0;

    font-family: inherit;

    font-size: 11px;

    line-height: 18px;
}


.cw-input::placeholder {

    color:
        var(--cw-light-text);
}


.cw-send {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    padding: 0;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            var(--cw-teal),
            var(--cw-teal-dark)
        );

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 17px;

    box-shadow:
        0 5px 12px
        rgba(15,118,110,.20);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        opacity .18s ease;
}


.cw-send:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 17px
        rgba(15,118,110,.28);
}


.cw-send:active {

    transform:
        scale(.93);
}


.cw-send:disabled {

    opacity: .55;

    cursor:
        not-allowed;

    transform: none;
}


/* =========================================================
   FOOTER
========================================================= */

.cw-footer {

    flex: 0 0 auto;

    width: 100%;

    background: white;

    color:
        #94a3b8;

    text-align: center;

    font-size: 7px;

    line-height: 13px;

    padding:
        0 0 6px;
}


/* =========================================================
   ERROR
========================================================= */

.cw-error {

    padding:
        8px 10px;

    margin:
        0 10px 8px;

    border-radius: 9px;

    background:
        #fef2f2;

    border:
        1px solid
        #fecaca;

    color:
        #b91c1c;

    font-size: 8px;

    display: none;
}


.cw-error.cw-show {

    display: block;
}


/* =========================================================
   FOCUS
========================================================= */

.cw-action:focus-visible,
.cw-send:focus-visible,
.cw-launcher:focus-visible,
.cw-user:focus-visible {

    outline:
        3px solid
        rgba(15,118,110,.25);

    outline-offset:
        2px;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 700px) {

    .cw-widget {

        right: 16px;

        bottom: 16px;

        width:
            calc(100vw - 32px);

        max-width:
            calc(100vw - 32px);

        height:
            min(650px, calc(100vh - 32px));

        max-height:
            calc(100vh - 32px);
    }


    .cw-launcher {

        right: 18px;

        bottom: 18px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .cw-widget {

        right: 8px;

        bottom: 8px;

        width:
            calc(100vw - 16px);

        max-width:
            calc(100vw - 16px);

        height:
            calc(100vh - 16px);

        max-height:
            calc(100vh - 16px);

<script>

/* =========================================================
   WEBCODEFT CHAT - DJANGO VERSION
========================================================= */

(function () {

    "use strict";


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const widget =
        document.getElementById("cwWidget");

    const launcher =
        document.getElementById("cwLauncher");

    const minimize =
        document.getElementById("cwMinimize");

    const close =
        document.getElementById("cwClose");

    const messages =
        document.getElementById("cwMessages");

    const empty =
        document.getElementById("cwEmpty");

    const input =
        document.getElementById("cwInput");

    const send =
        document.getElementById("cwSend");

    const unread =
        document.getElementById("cwUnread");

    const usersContainer =
        document.getElementById("cwUsers");

    const usersLoading =
        document.getElementById("cwUsersLoading");

    const search =
        document.getElementById("cwSearch");

    const selectedBar =
        document.getElementById("cwSelectedBar");

    const selectedAvatar =
        document.getElementById("cwSelectedAvatar");

    const selectedName =
        document.getElementById("cwSelectedName");

    const selectedStatus =
        document.getElementById("cwSelectedStatus");

    const errorBox =
        document.getElementById("cwError");


    /* =====================================================
       SAFETY
    ====================================================== */

    if (
        !widget ||
        !launcher ||
        !messages ||
        !input ||
        !send
    ) {

        console.warn(
            "Webcodeft Chat Widget could not initialize."
        );

        return;
    }


    /* =====================================================
       DJANGO URLS
    ====================================================== */

    const CHAT_USERS_URL =
        "{% url 'chat_users' %}";

    const CHAT_STATUS_URL =
        "{% url 'chat_update_status' %}";

    /*
       999999 is only a placeholder.
       It will be replaced with the selected user ID.
    */

    const CHAT_MESSAGES_URL =
        "{% url 'chat_messages' 999999 %}";

    const CHAT_SEND_URL =
        "{% url 'chat_send_message' 999999 %}";


    /* =====================================================
       CURRENT USER
    ====================================================== */

    const CURRENT_USER_ID =
        Number(
            "{{ request.user.id|default:'' }}"
        ) || null;


    /* =====================================================
       STATE
    ====================================================== */

    let users = [];

    let selectedUserId = null;

    let selectedUser = null;

    let messagesInterval = null;

    let usersInterval = null;

    let statusInterval = null;

    let isLoadingMessages = false;

    let firstMessageLoad = true;


    /* =====================================================
       CSRF
    ====================================================== */

    function getCookie(name) {

        const cookies =
            document.cookie
                ? document.cookie.split(";")
                : [];

        for (
            let cookie of cookies
        ) {

            cookie = cookie.trim();

            if (
                cookie.startsWith(
                    name + "="
                )
            ) {

                return decodeURIComponent(
                    cookie.substring(
                        name.length + 1
                    )
                );
            }
        }

        return null;
    }


    function getCSRFToken() {

        const tokenInput =
            document.querySelector(
                "#cwCsrf input[name='csrfmiddlewaretoken']"
            );

        if (
            tokenInput &&
            tokenInput.value
        ) {

            return tokenInput.value;
        }

        return getCookie("csrftoken");
    }


    /* =====================================================
       ERROR
    ====================================================== */

    function showError(message) {

        if (!errorBox) {
            return;
        }

        errorBox.textContent =
            message || "Something went wrong.";

        errorBox.classList.add(
            "cw-show"
        );


        setTimeout(function () {

            errorBox.classList.remove(
                "cw-show"
            );

        }, 4000);
    }


    function hideError() {

        if (!errorBox) {
            return;
        }

        errorBox.classList.remove(
            "cw-show"
        );
    }


    /* =====================================================
       URL BUILDER
    ====================================================== */

    function buildUserUrl(
        template,
        userId
    ) {

        return template.replace(
            "999999",
            String(userId)
        );
    }


    /* =====================================================
       OPEN
    ====================================================== */

    function openChat() {

        widget.classList.remove(
            "cw-hidden"
        );

        widget.classList.remove(
            "cw-minimized"
        );

        launcher.classList.add(
            "cw-is-hidden"
        );


        clearUnread();


        loadUsers();


        setTimeout(function () {

            if (
                selectedUserId
            ) {

                input.focus();

            }

            scrollToBottom();

        }, 150);
    }


    /* =====================================================
       CLOSE
    ====================================================== */

    function closeChat() {

        widget.classList.add(
            "cw-hidden"
        );

        widget.classList.remove(
            "cw-minimized"
        );

        launcher.classList.remove(
            "cw-is-hidden"
        );
    }


    /* =====================================================
       MINIMIZE
    ====================================================== */

    function minimizeChat() {

        widget.classList.toggle(
            "cw-minimized"
        );
    }


    /* =====================================================
       SCROLL
    ====================================================== */

    function scrollToBottom() {

        if (!messages) {
            return;
        }

        messages.scrollTop =
            messages.scrollHeight;
    }


    /* =====================================================
       INITIALS
    ====================================================== */

    function getInitials(name) {

        if (!name) {
            return "?";
        }


        const parts =
            name.trim().split(/\s+/);


        if (parts.length === 1) {

            return parts[0]
                .substring(0, 2)
                .toUpperCase();
        }


        return (
            parts[0][0] +
            parts[1][0]
        ).toUpperCase();
    }


    /* =====================================================
       LOAD USERS
    ====================================================== */

    async function loadUsers() {

        try {

            const response =
                await fetch(
                    CHAT_USERS_URL,
                    {
                        method: "GET",
                        credentials: "same-origin",
                        headers: {
                            "X-Requested-With":
                                "XMLHttpRequest"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load users."
                );
            }


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Unable to load users."
                );
            }


            users =
                Array.isArray(
                    data.users
                )
                    ? data.users
                    : [];


            renderUsers();


            updateTotalUnread();


            /*
             * If selected user still exists,
             * update its information.
             */

            if (selectedUserId) {

                const updatedUser =
                    users.find(
                        function (user) {

                            return (
                                Number(user.id) ===
                                Number(selectedUserId)
                            );

                        }
                    );


                if (updatedUser) {

                    selectedUser =
                        updatedUser;

                    updateSelectedUser(
                        updatedUser
                    );
                }
            }

        }
        catch (error) {

            console.error(
                "Chat users error:",
                error
            );


            if (
                users.length === 0
            ) {

                usersContainer.innerHTML = "";

                const noUsers =
                    document.createElement(
                        "div"
                    );

                noUsers.className =
                    "cw-no-users";

                noUsers.textContent =
                    "Unable to load employees.";

                usersContainer.appendChild(
                    noUsers
                );
            }

        }
    }


    /* =====================================================
       RENDER USERS
    ====================================================== */

    function renderUsers() {

        const searchText =
            search.value
                .trim()
                .toLowerCase();


        usersContainer.innerHTML = "";


        let filteredUsers =
            users.filter(
                function (user) {

                    if (!searchText) {
                        return true;
                    }


                    const name =
                        String(
                            user.name || ""
                        ).toLowerCase();


                    const username =
                        String(
                            user.username || ""
                        ).toLowerCase();


                    const email =
                        String(
                            user.email || ""
                        ).toLowerCase();


                    return (
                        name.includes(searchText) ||
                        username.includes(searchText) ||
                        email.includes(searchText)
                    );
                }
            );


        if (
            filteredUsers.length === 0
        ) {

            const noUsers =
                document.createElement(
                    "div"
                );

            noUsers.className =
                "cw-no-users";


            noUsers.textContent =
                users.length === 0
                    ? "No employees available."
                    : "No matching users found.";


            usersContainer.appendChild(
                noUsers
            );

            return;
        }


        filteredUsers.forEach(
            function (user) {

                const userButton =
                    document.createElement(
                        "button"
                    );


                userButton.type =
                    "button";


                userButton.className =
                    "cw-user";


                if (
                    Number(user.id) ===
                    Number(selectedUserId)
                ) {

                    userButton.classList.add(
                        "cw-selected"
                    );
                }


                userButton.setAttribute(
                    "aria-label",
                    "Chat with " +
                    user.name
                );


                /* Avatar */

                const avatar =
                    document.createElement(
                        "div"
                    );

                avatar.className =
                    "cw-user-avatar";


                avatar.textContent =
                    getInitials(
                        user.name
                    );


                /* Status */

                const statusDot =
                    document.createElement(
                        "span"
                    );

                statusDot.className =
                    "cw-status-dot";


                if (
                    user.is_online
                ) {

                    statusDot.classList.add(
                        "cw-status-online"
                    );
                }


                avatar.appendChild(
                    statusDot
                );


                /* User info */

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "cw-user-info";


                const name =
                    document.createElement(
                        "span"
                    );

                name.className =
                    "cw-user-name";

                name.textContent =
                    user.name ||
                    user.username ||
                    "User";


                const status =
                    document.createElement(
                        "span"
                    );

                status.className =
                    "cw-user-status";


                status.textContent =
                    user.is_online
                        ? "Online"
                        : "Offline";


                info.appendChild(name);

                info.appendChild(status);


                /* Unread */

                const unreadBadge =
                    document.createElement(
                        "span"
                    );

                unreadBadge.className =
                    "cw-user-unread";


                if (
                    Number(user.unread || 0) > 0
                ) {

                    unreadBadge.style.display =
                        "flex";

                    unreadBadge.textContent =
                        Number(user.unread) > 99
                            ? "99+"
                            : user.unread;
                }


                userButton.appendChild(
                    avatar
                );

                userButton.appendChild(
                    info
                );

                userButton.appendChild(
                    unreadBadge
                );


                userButton.addEventListener(
                    "click",
                    function () {

                        selectUser(user);

                    }
                );


                usersContainer.appendChild(
                    userButton
                );

            }
        );


        if (usersLoading) {

            usersLoading.style.display =
                "none";
        }
    }


    /* =====================================================
       SEARCH
    ====================================================== */

    search.addEventListener(
        "input",
        function () {

            renderUsers();

        }
    );


    /* =====================================================
       SELECT USER
    ====================================================== */

    function selectUser(user) {

        if (!user) {
            return;
        }


        selectedUser =
            user;

        selectedUserId =
            Number(user.id);


        selectedBar.style.display =
            "flex";


        updateSelectedUser(
            user
        );


        input.disabled =
            false;

        send.disabled =
            false;

        input.placeholder =
            "Message " +
            (
                user.name ||
                user.username ||
                "user"
            ) +
            "...";


        hideError();


        renderUsers();


        loadMessages(
            selectedUserId,
            true
        );


        startMessagePolling();


        setTimeout(function () {

            input.focus();

        }, 100);
    }


    /* =====================================================
       UPDATE SELECTED USER
    ====================================================== */

    function updateSelectedUser(user) {

        selectedAvatar.textContent =
            getInitials(
                user.name
            );


        selectedName.textContent =
            user.name ||
            user.username ||
            "User";


        if (
            user.is_online
        ) {

            selectedStatus.textContent =
                "Online";

            selectedStatus.classList.add(
                "cw-online-text"
            );

        }
        else {

            selectedStatus.textContent =
                user.last_seen
                    ? "Offline"
                    : "Offline";

            selectedStatus.classList.remove(
                "cw-online-text"
            );
        }
    }


    /* =====================================================
       LOAD MESSAGES
    ====================================================== */

    async function loadMessages(
        userId,
        scrollAfter = false
    ) {

        if (
            !userId ||
            isLoadingMessages
        ) {

            return;
        }


        isLoadingMessages =
            true;


        try {

            const url =
                buildUserUrl(
                    CHAT_MESSAGES_URL,
                    userId
                );


            const response =
                await fetch(
                    url,
                    {
                        method: "GET",
                        credentials: "same-origin",
                        headers: {
                            "X-Requested-With":
                                "XMLHttpRequest"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load messages."
                );
            }


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Unable to load messages."
                );
            }


            renderMessages(
                data.messages || [],
                scrollAfter
            );


        }
        catch (error) {

            console.error(
                "Chat messages error:",
                error
            );


            showError(
                error.message
            );

        }
        finally {

            isLoadingMessages =
                false;
        }
    }


    /* =====================================================
       RENDER MESSAGES
    ====================================================== */

    function renderMessages(
        chatMessages,
        scrollAfter
    ) {

        messages.innerHTML = "";


        /* Date */

        const date =
            document.createElement(
                "div"
            );

        date.className =
            "cw-date";


        const dateText =
            document.createElement(
                "span"
            );

        dateText.textContent =
            "Today";


        date.appendChild(
            dateText
        );


        messages.appendChild(
            date
        );


        if (
            !chatMessages.length
        ) {

            const emptyState =
                document.createElement(
                    "div"
                );

            emptyState.className =
                "cw-empty";


            const inner =
                document.createElement(
                    "div"
                );

            inner.className =
                "cw-empty-inner";


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "cw-empty-icon";

            icon.textContent =
                "💬";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "cw-empty-title";

            title.textContent =
                "Start a conversation";


            const text =
                document.createElement(
                    "p"
                );

            text.className =
                "cw-empty-text";

            text.textContent =
                "Send a message to start chatting.";


            inner.appendChild(icon);

            inner.appendChild(title);

            inner.appendChild(text);

            emptyState.appendChild(inner);

            messages.appendChild(
                emptyState
            );


            return;
        }


        chatMessages.forEach(
            function (msg) {

                const type =
                    Number(msg.sender_id) ===
                    Number(CURRENT_USER_ID)
                        ? "sent"
                        : "received";


                addMessage(
                    msg.message,
                    type,
                    msg.timestamp,
                    false
                );

            }
        );


        if (
            scrollAfter ||
            firstMessageLoad
        ) {

            scrollToBottom();

            firstMessageLoad =
                false;
        }
    }


    /* =====================================================
       ADD MESSAGE
    ====================================================== */

    function addMessage(
        text,
        type,
        time,
        shouldScroll = true
    ) {

        if (
            !text ||
            !String(text).trim()
        ) {

            return;
        }


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "cw-message-row " +
            (
                type === "received"
                    ? "cw-received"
                    : "cw-sent"
            );


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "cw-message " +
            (
                type === "received"
                    ? "cw-received-message"
                    : "cw-sent-message"
            );


        const messageText =
            document.createElement(
                "div"
            );


        /*
         * textContent prevents HTML injection.
         */

        messageText.textContent =
            String(text).trim();


        const meta =
            document.createElement(
                "div"
            );


        meta.className =
            "cw-meta";


        meta.textContent =
            time ||
            currentTime();


        bubble.appendChild(
            messageText
        );

        bubble.appendChild(
            meta
        );


        row.appendChild(
            bubble
        );


        messages.appendChild(
            row
        );


        if (shouldScroll) {

            scrollToBottom();
        }
    }


    /* =====================================================
       SEND MESSAGE
    ====================================================== */

    async function sendMessage() {

        if (
            !selectedUserId
        ) {

            showError(
                "Please select a user first."
            );

            return;
        }


        const text =
            input.value.trim();


        if (!text) {

            return;
        }


        if (
            text.length > 2000
        ) {

            showError(
                "Message is too long."
            );

            return;
        }


        send.disabled =
            true;


        try {

            const url =
                buildUserUrl(
                    CHAT_SEND_URL,
                    selectedUserId
                );


            const csrfToken =
                getCSRFToken();


            const response =
                await fetch(
                    url,
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "X-CSRFToken":
                                csrfToken || "",

                            "X-Requested-With":
                                "XMLHttpRequest"
                        },

                        body:
                            JSON.stringify({
                                message: text
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Unable to send message."
                );
            }


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Unable to send message."
                );
            }


            /*
             * Clear input.
             */

            input.value =
                "";

            autoResize();


            /*
             * Reload messages from DB.
             */

            await loadMessages(
                selectedUserId,
                true
            );


            /*
             * Update unread/user data.
             */

            await loadUsers();


        }
        catch (error) {

            console.error(
                "Send message error:",
                error
            );


            showError(
                error.message
            );

        }
        finally {

            send.disabled =
                !selectedUserId;
        }
    }


    /* =====================================================
       AUTO RESIZE
    ====================================================== */

    function autoResize() {

        input.style.height =
            "auto";


        const newHeight =
            Math.min(
                input.scrollHeight,
                100
            );


        input.style.height =
            newHeight + "px";
    }


    /* =====================================================
       CURRENT TIME
    ====================================================== */

    function currentTime() {

        return new Date()
            .toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }


    /* =====================================================
       TOTAL UNREAD
    ====================================================== */

    function updateTotalUnread() {

        let total = 0;


        users.forEach(
            function (user) {

                total +=
                    Number(
                        user.unread || 0
                    );
            }
        );


        /*
         * If chat is open,
         * do not show launcher badge.
         */

        if (
            !widget.classList.contains(
                "cw-hidden"
            )
        ) {

            clearUnread();

            return;
        }


        if (
            total <= 0
        ) {

            clearUnread();

            return;
        }


        unread.textContent =
            total > 99
                ? "99+"
                : total;


        unread.style.display =
            "flex";
    }


    /* =====================================================
       CLEAR UNREAD
    ====================================================== */

    function clearUnread() {

        unread.textContent =
            "0";

        unread.style.display =
            "none";
    }


    /* =====================================================
       MESSAGE POLLING
    ====================================================== */

    function startMessagePolling() {

        stopMessagePolling();


        messagesInterval =
            setInterval(
                function () {

                    if (
                        selectedUserId &&
                        !widget.classList.contains(
                            "cw-hidden"
                        ) &&
                        !widget.classList.contains(
                            "cw-minimized"
                        )
                    ) {

                        loadMessages(
                            selectedUserId,
                            false
                        );

                    }

                },
                3000
            );
    }


    function stopMessagePolling() {

        if (
            messagesInterval
        ) {

            clearInterval(
                messagesInterval
            );

            messagesInterval =
                null;
        }
    }


    /* =====================================================
       USERS POLLING
    ====================================================== */

    function startUsersPolling() {

        if (usersInterval) {
            clearInterval(
                usersInterval
            );
        }


        usersInterval =
            setInterval(
                function () {

                    loadUsers();

                },
                10000
            );
    }


    /* =====================================================
       ONLINE STATUS
    ====================================================== */

    async function updateOnlineStatus() {

        try {

            const csrfToken =
                getCSRFToken();


            await fetch(
                CHAT_STATUS_URL,
                {
                    method: "POST",

                    credentials:
                        "same-origin",

                    headers: {

                        "X-CSRFToken":
                            csrfToken || "",

                        "X-Requested-With":
                            "XMLHttpRequest"
                    }
                }
            );

        }
        catch (error) {

            console.warn(
                "Chat status update failed:",
                error
            );
        }
    }


    /* =====================================================
       START STATUS HEARTBEAT
    ====================================================== */

    function startStatusHeartbeat() {

        updateOnlineStatus();


        if (statusInterval) {

            clearInterval(
                statusInterval
            );
        }


        statusInterval =
            setInterval(
                function () {

                    updateOnlineStatus();

                },
                30000
            );
    }


    /* =====================================================
       EVENTS
    ====================================================== */

    launcher.addEventListener(
        "click",
        openChat
    );


    close.addEventListener(
        "click",
        closeChat
    );


    minimize.addEventListener(
        "click",
        minimizeChat
    );


    send.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "input",
        autoResize
    );


    /* =====================================================
       ENTER = SEND
       SHIFT + ENTER = NEW LINE
    ====================================================== */

    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    /* =====================================================
       ESC = CLOSE
    ====================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                !widget.classList.contains(
                    "cw-hidden"
                )
            ) {

                closeChat();
            }
        }
    );


    /* =====================================================
       INITIALIZE
    ====================================================== */

    widget.classList.add(
        "cw-hidden"
    );


    launcher.classList.remove(
        "cw-is-hidden"
    );


    /*
     * Load users immediately.
     *
     * This means when widget opens,
     * employee list is already available.
     */

    loadUsers();


    /*
     * Keep employee/admin list updated.
     */

    startUsersPolling();


    /*
     * Keep current user online.
     */

    startStatusHeartbeat();


    /* =====================================================
       GLOBAL CHAT API
    ====================================================== */

    window.WebcodeftChat = {

        open:
            openChat,

        close:
            closeChat,

        minimize:
            minimizeChat,

        loadUsers:
            loadUsers,

        selectUser:
            selectUser,

        loadMessages:
            loadMessages,

        sendMessage:
            sendMessage,

        addMessage:
            addMessage,

        unread:
            function (count) {

                if (
                    Number(count) > 0
                ) {

                    unread.textContent =
                        Number(count) > 99
                            ? "99+"
                            : count;

                    unread.style.display =
                        "flex";
                }
            },

        clearUnread:
            clearUnread,

        scrollToBottom:
            scrollToBottom
    };


})();

</script>
