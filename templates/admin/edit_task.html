{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task | Smart Office</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7f8;
            font-family: Arial, sans-serif;
            color: #173f45;
        }

        .main-container {
            max-width: 1100px;
            margin: auto;
            padding: 40px;
        }

        /* ================= HEADER ================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            margin: 0;
            font-size: 36px;
            font-weight: 700;
            color: #164f57;
        }

        .page-subtitle {
            margin-top: 8px;
            margin-bottom: 0;
            font-size: 16px;
            color: #72869b;
        }

        .back-btn {
            height: 52px;
            padding: 0 22px;
            border-radius: 12px;
            background: #ffffff;
            color: #087c83;
            border: 1px solid #0b9694;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 15px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .back-btn:hover {
            background: #eaf8f7;
            color: #086c72;
        }

        /* ================= CARD ================= */

        .form-card {
            background: #ffffff;
            border: 1px solid #e2e9eb;
            border-radius: 19px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(25, 65, 70, 0.05);
        }

        .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #164b53;
            margin-bottom: 28px;
        }

        /* ================= FORM ================= */

        .form-label {
            font-size: 15px;
            font-weight: 600;
            color: #213e56;
            margin-bottom: 8px;
        }

        .required {
            color: #dc3545;
        }

        .form-control,
        .form-select {
            min-height: 54px;
            border: 1px solid #d9e2e5;
            border-radius: 11px;
            font-size: 15px;
            color: #31465b;
            padding: 12px 15px;
            box-shadow: none !important;
        }

        textarea.form-control {
            min-height: 125px;
            resize: vertical;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0b9089;
            box-shadow: 0 0 0 3px rgba(11, 144, 137, 0.08) !important;
        }

        .form-group {
            margin-bottom: 22px;
        }

        /* ================= BUTTONS ================= */

        .button-area {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
            padding-top: 25px;
            border-top: 1px solid #edf1f2;
        }

        .cancel-btn,
        .update-btn {
            height: 52px;
            padding: 0 25px;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .cancel-btn {
            background: #ffffff;
            color: #647586;
            border: 1px solid #d8e0e3;
        }

        .cancel-btn:hover {
            background: #f5f8f8;
            color: #4e6070;
        }

        .update-btn {
            background: #0b9089;
            color: #ffffff;
            border: 1px solid #0b9089;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #087b76;
            border-color: #087b76;
        }

        /* ================= ALERT ================= */

        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 22px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {

            .main-container {
                padding: 22px 16px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }

            .page-title {
                font-size: 30px;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
            }

            .form-card {
                padding: 22px;
            }

            .button-area {
                flex-direction: column;
            }

            .cancel-btn,
            .update-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="main-container">


    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div>

            <h1 class="page-title">
                Edit Task
            </h1>

            <p class="page-subtitle">
                Update task details and assignment information.
            </p>

        </div>


        <a
            href="{% url 'tasks' %}"
            class="back-btn"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Tasks

        </a>

    </div>


    <!-- ================= MESSAGES ================= -->

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <!-- ================= FORM CARD ================= -->

    <div class="form-card">

        <div class="form-title">
            Task Information
        </div>


        <form
            method="POST"
            action=""
        >

            {% csrf_token %}


            <div class="row">


                <!-- Task Title -->

                <div class="col-md-6">

                    <div class="form-group">

                        <label class="form-label">
                            Task Title
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ task.title }}"
                            placeholder="Enter task title"
                            required
                        >

                    </div>

                </div>


                <!-- Project -->

                <div class="col-md-6">

                  <div class="form-group">
    <label for="project">Project</label>

    <select name="project" id="project" class="form-control">

        <option value="">Select Project</option>

        {% for project in projects %}
            <option value="{{ project.id }}"
                {% if task.project and task.project.id == project.id %}
                    selected
                {% endif %}
            >
                {{ project.project_name }}
            </option>
        {% endfor %}

    </select>
</div>

                </div>


                <!-- Employee -->

                <div class="col-md-6">

                    <div class="form-group">

                        <label class="form-label">
                            Assign To
                            <span class="required">*</span>
                        </label>

                        <select
                            name="assigned_to"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Employee
                            </option>

                            {% for employee in employees %}

                                <option
                                    value="{{ employee.id }}"
                                    {% if task.assigned_to_id == employee.id %}
                                        selected
                                    {% endif %}
                                >

                                    {{ employee.get_full_name|default:employee.username }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- Task Date -->

                <div class="col-md-3">

                    <div class="form-group">

                        <label class="form-label">
                            Task Date
                            <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            name="task_date"
                            class="form-control"
                            value="{{ task.task_date|date:'Y-m-d' }}"
                            required
                        >

                    </div>

                </div>


                <!-- Due Time -->

                <div class="col-md-3">

                    <div class="form-group">

                        <label class="form-label">
                            Due Date
                        </label>

                        <input
                            type="time"
                            name="due_time" 
                            class="form-control"
                            value="{{ task.due_time|date:'Y-m-d' }}"
                        >

                    </div>

                </div>


                <!-- Priority -->

                <div class="col-md-6">

                    <div class="form-group">

                        <label class="form-label">
                            Priority
                            <span class="required">*</span>
                        </label>

                        <select
                            name="priority"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Priority
                            </option>

                            <option
                                value="high"
                                {% if task.priority == "high" %}
                                    selected
                                {% endif %}
                            >
                                High
                            </option>

                            <option
                                value="medium"
                                {% if task.priority == "medium" %}
                                    selected
                                {% endif %}
                            >
                                Medium
                            </option>

                            <option
                                value="low"
                                {% if task.priority == "low" %}
                                    selected
                                {% endif %}
                            >
                                Low
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Status -->

                <div class="col-md-6">

                    <div class="form-group">

                        <label class="form-label">
                            Status
                            <span class="required">*</span>
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            <option
                                value="pending"
                                {% if task.status == "pending" %}
                                    selected
                                {% endif %}
                            >
                                Pending
                            </option>

                            <option
                                value="in-progress"
                                {% if task.status == "in-progress" %}
                                    selected
                                {% endif %}
                            >
                                In Progress
                            </option>

                            

                            <option
                                value="completed"
                                {% if task.status == "completed" %}
                                    selected
                                {% endif %}
                            >
                                Completed
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Description -->

                <div class="col-12">

                    <div class="form-group">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            placeholder="Enter task description"
                        >{{ task.description }}</textarea>

                    </div>

                </div>


            </div>


            <!-- ================= BUTTONS ================= -->

            <div class="button-area">

                <a
                    href="{% url 'tasks' %}"
                    class="cancel-btn"
                >

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </a>


                <button
                    type="submit"
                    class="update-btn"
                >

                    <i class="fa-solid fa-pen"></i>

                    Update Task

                </button>

            </div>


        </form>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
{% include "chat/chat_widget.html" %}
</body>

</html>
